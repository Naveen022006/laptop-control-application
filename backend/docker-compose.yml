# Backend Docker Compose

version: '3.8'

services:
  backend:
    build: .
    container_name: laptop-control-backend
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - DATABASE_URL=sqlite:///./laptop_control.db
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DEBUG=false
      - CORS_ORIGINS=*
    volumes:
      - ./logs:/app/logs
      - ./instance:/app/instance
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

